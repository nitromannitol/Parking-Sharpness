version: "v0.3"

project:
  name: "Parking-Sharpness"
  authors:
    - "Ahmed Bou-Rabee"
  license: "Apache-2.0"

sources:
  - title: "Sharpness and critical scaling of parking"
    authors:
      - "Ahmed Bou-Rabee"
      - "Christoforos Panagiotis"
    id: "arXiv:2609.02820"
    url: "https://arxiv.org/abs/2609.02820"
    type: "preprint"
    license: ""                 # TODO(author): the license under which the paper is published
    author_contacted: "n/a"     # the formalizer is an author of the source
    prior_work: ""

status:
  scope: >-
    A Lean 4 / Mathlib formalization of every theorem, lemma, proposition and
    corollary of the paper: the stretched-exponential settling time below the
    critical density (Theorem 1.1), the comparison of the two expected
    odometers (Theorem 1.2), the growth at the critical density (Corollary
    1.3), the quenched odometer comparison (Theorem 1.4), the nearest hole and
    particle in dimensions at most three and the counterexample in dimensions
    at least five (Theorems 1.5 and 1.6), near criticality (Theorem 1.7), the
    oriented walk (Theorem 1.8), and the lemmas and propositions of Sections 2
    to 9 behind them, 41 paper statements in all.  SCOPE BOUNDARY: eighteen
    results the paper quotes from the literature are stated as propositions in
    Parking/External/ and are explicit hypotheses of every theorem whose proof
    uses them; ASSUMPTIONS.md lists them with their Lean statements.  One of
    them, the growth of the mean divisible sandpile odometer, is also proved
    from the formalization of the divisible sandpile paper under that
    formalization's own three continuum assumptions.  Two further quoted
    results, the optimal stopping representation of the divisible odometer
    and the Green gradient bound, are proved here from the shared library.
    Not formalized: the proof-overview and related-work
    subsections, the five remarks, and the two figures.  The main theorems are
    stated in full in Parking/MainTheorems.lean; all eight are additionally
    restated over a Mathlib-only vocabulary for the Lean comparator (Audit/).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Parking.subcritical_tail"
      file: "Parking/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/SubcriticalTail/comparator.json"
      literature_dependencies:
        - "Donsker and Varadhan 1979, Theorem 1, the range estimate (Parking.External.DonskerVaradhanRange), hypothesis"
    - declaration: "Parking.master"
      file: "Parking/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/Master/comparator.json"
      literature_dependencies:
        - "Bou-Rabee and Panagiotis, Theorem 1.3, Corollary 6.2, Theorem 6.6 and (94), the growth of the mean divisible sandpile odometer (Parking.External.SandpileGrowth), hypothesis"
        - "Pinelis, Theorems 4.1 and 3.3, the martingale moment and Bernstein inequalities (Parking.External.Bernstein), hypothesis"
        - "Bou-Rabee and Panagiotis, Remark 3.4, the concentration estimate for the divisible odometer (Parking.External.UConcentration), hypothesis"
        - "Bou-Rabee and Panagiotis, Section 3.1, the collected Green function estimates (Parking.External.GreenNorms), hypothesis"
    - declaration: "Parking.growth"
