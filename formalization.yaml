        - "Pinelis, Theorems 4.1 and 3.3, the martingale moment and Bernstein inequalities (Parking.External.Bernstein), hypothesis"
        - "Bou-Rabee and Panagiotis, Remark 3.4, the concentration estimate for the divisible odometer (Parking.External.UConcentration), hypothesis"
        - "Bou-Rabee and Panagiotis, Section 3.1, the collected Green function estimates (Parking.External.GreenNorms), hypothesis"
    - declaration: "Parking.trichotomy"
