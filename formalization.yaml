      lean: "Parking.subcritical_tail"
      module: "Parking.MainTheorems"
      status: "proved"
      note: "Certified statement Parking.Frozen.subcritical_tail (thm-subcritical-tail). Comparator challenge ParkingAudit/SubcriticalTail/."
    - source: "Theorem 1.2 (thm:master)"
      lean: "Parking.master"
      module: "Parking.MainTheorems"
      status: "proved"
      note: "Certified statement Parking.Frozen.master (thm-master). Comparator challenge ParkingAudit/Master/."
    - source: "Corollary 1.3 (cor:growth)"
