version: "v0.4"

project:
  name: "Parking-Sharpness"
  description: >-
    A Lean 4 / Mathlib formalization of "Sharpness and critical scaling of
    parking" (Bou-Rabee and Panagiotis): at the critical density the expected
    particle odometer of the parking process on Z^d is comparable to the
    expected divisible sandpile odometer plus log n (Theorem 1.2), hence of
    order n^((4-d)/4) for d <= 3 and log n for d >= 4 (Corollary 1.3), and
    below the critical density the settling time has a stretched-exponential
    tail with exponent d/(d+2) (Theorem 1.1).  It also formalizes the quenched
    comparison of the two odometers (Theorem 1.4), the nearest hole and
    particle (Theorems 1.5 and 1.6), near criticality (Theorem 1.7) and the
    oriented walk (Theorem 1.8), with every lemma and proposition behind them;
    eleven results the paper quotes from the literature are carried as explicit
    hypotheses of the theorems that use them.  The eight main theorems are
    independently checked using the ParkingAudit/ comparator pairs.
  authors:
    - "Ahmed Bou-Rabee"
  responsible_maintainers:
    - "Ahmed Bou-Rabee"
  license: "Apache-2.0"

sources:
  - title: "Sharpness and critical scaling of parking"
    authors:
      - "Ahmed Bou-Rabee"
      - "Christoforos Panagiotis"
    id: "arXiv:2609.02820"
    url: "https://arxiv.org/abs/2609.02820"
    type: "preprint"
    relationship: "formalizes"
    note: >-
      The paper under formalization.  Every theorem, lemma, proposition and
      corollary of the paper is formalized, following paper/parking.tex, which
      is arXiv:2609.02820v1 with the corrections listed in
      paper/CHANGES_FROM_ARXIV.md; see status.scope for the scope boundary and
      fidelity.divergences for the differences from the paper.
    license: ""                 # TODO(author): the license under which the paper is published
    author_contacted: "n/a"     # the formalizer is an author of the source
    prior_work: ""

related_formalizations:
  - id: "https://github.com/nitromannitol/Lattice-Probability"
    relationship: "builds-on"
    note: >-
      The shared library Lattice-Probability (LatticeProb): the lattice, the
      simple random walk and its Green functions, the particle-hole process
      and the toolkits for results that do not depend on the parking model.
      Pinned git dependency at commit 9d44b4d4670df393bb86ac5a4e042f215001cddf.
  - id: "https://github.com/nitromannitol/Divisible-Sandpile-Percolation"
    relationship: "builds-on"
    note: >-
      The formalization (Sandpile) of the divisible sandpile paper that this
      paper quotes its growth estimate from.  Pinned git dependency at commit
      cd8b15a32d00b1eec48f8747339e2d0cfaa73a21; the growth of the mean
      divisible sandpile odometer is proved from it under that formalization's
      own three continuum assumptions.

status:
  scope: >-
    A Lean 4 / Mathlib formalization of every theorem, lemma, proposition and
    corollary of the paper: the stretched-exponential settling time below the
    critical density (Theorem 1.1), the comparison of the two expected
    odometers (Theorem 1.2), the growth at the critical density (Corollary
    1.3), the quenched odometer comparison (Theorem 1.4), the nearest hole and
    particle in dimensions at most three and the counterexample in dimensions
    at least five (Theorems 1.5 and 1.6), near criticality (Theorem 1.7), the
    oriented walk (Theorem 1.8), and the lemmas and propositions of Sections 2
    to 9 behind them, 41 paper statements in all.  SCOPE BOUNDARY: eleven
    results the paper quotes from the literature are stated as propositions in
    Parking/External/ and are explicit hypotheses of every theorem whose proof
    uses them; ASSUMPTIONS.md lists them with their Lean statements.  One of
    them, the growth of the mean divisible sandpile odometer, is also proved
    from the formalization of the divisible sandpile paper under that
    formalization's own three continuum assumptions.  Nine further quoted
    results, the optimal stopping representation of the divisible odometer,
    the Green gradient bound, the variance-scale hypothesis, the binomial and
    simple-random-walk local central limit theorems, the collected
    Green-function norms, the U-concentration estimate, the critical-scale
    lower-tail estimate, and the classical strong minimum principle for the
    heat operator, are proved here (from the shared library, or, for the
    last, from classical parabolic theory) and are not hypotheses of the
    theorems that use them.
    Not formalized: the proof-overview and related-work
    subsections, the five remarks, and the two figures.  The main theorems are
    stated in full in Parking/MainTheorems.lean; all eight are additionally
    restated over a Mathlib-only vocabulary for the Lean comparator (ParkingAudit/).
  sorry_count: 0
  sorry_count_scope: "Parking production library only"
  comparator_challenge_sorry_count: 8
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Parking.subcritical_tail"
      file: "Parking/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "ParkingAudit/SubcriticalTail/comparator.json"
      literature_dependencies:
        - statement: "the range estimate (Parking.External.DonskerVaradhanRange), carried as an explicit hypothesis"
          source: "Donsker and Varadhan 1979, Theorem 1"
    - declaration: "Parking.master"
      file: "Parking/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "ParkingAudit/Master/comparator.json"
      literature_dependencies:
        - statement: "the growth of the mean divisible sandpile odometer (Parking.External.SandpileGrowth), carried as an explicit hypothesis"
          source: "Bou-Rabee and Panagiotis, Theorem 1.3, Corollary 6.2, Theorem 6.6 and (94)"
        - statement: "the martingale moment and Bernstein inequalities (Parking.External.Bernstein), carried as an explicit hypothesis"
          source: "Pinelis, Theorems 4.1 and 3.3"
    - declaration: "Parking.growth"
      file: "Parking/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "ParkingAudit/Growth/comparator.json"
      literature_dependencies:
        - statement: "the growth of the mean divisible sandpile odometer (Parking.External.SandpileGrowth), carried as an explicit hypothesis"
          source: "Bou-Rabee and Panagiotis, Theorem 1.3, Corollary 6.2, Theorem 6.6 and (94)"
        - statement: "the martingale moment and Bernstein inequalities (Parking.External.Bernstein), carried as an explicit hypothesis"
          source: "Pinelis, Theorems 4.1 and 3.3"
    - declaration: "Parking.trichotomy"
      file: "Parking/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "ParkingAudit/Trichotomy/comparator.json"
      literature_dependencies:
        - statement: "the growth of the mean divisible sandpile odometer (Parking.External.SandpileGrowth), carried as an explicit hypothesis"
          source: "Bou-Rabee and Panagiotis, Theorem 1.3, Corollary 6.2, Theorem 6.6 and (94)"
        - statement: "the martingale moment and Bernstein inequalities (Parking.External.Bernstein), carried as an explicit hypothesis"
          source: "Pinelis, Theorems 4.1 and 3.3"
