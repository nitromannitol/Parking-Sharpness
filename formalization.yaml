automation:
  methods:
    - method: "agent"
      models:
        - "claude-fable-5-1"
        - "claude-opus-5"
        - "claude-sonnet-5"
        - "claude-opus-5-5"
        - "gpt-6-astra"
        - "deepseek-v4.1-flash"
        - "glm-5.3"
        - "glm-5.3-flash"
        - "kimi-code/k3-256k"
        - "gpt-6-luna"
        - "gpt-5.6-luna"
      framework: >-
        Claude Code (Anthropic) and Codex CLI (OpenAI) agentic coding harnesses,
        Kimi Code CLI, and scripted API agent loops and fan-outs for the
        DeepSeek and GLM models; most code by the Claude models
      tool_setup: >-
        Lake builds under leanprover/lean4:v4.32.0 with Mathlib at revision
        81a5d257c8e410db227a6665ed08f64fea08e997, Lattice-Probability at
        commit 9d44b4d4670df393bb86ac5a4e042f215001cddf and
        Divisible-Sandpile-Percolation at commit
        cd8b15a32d00b1eec48f8747339e2d0cfaa73a21.  A frozen-statement manifest
        (ledger/manifest.yaml) pins each registered statement by the SHA-256 of
        its text, and the tools/ checkers verify the hashes, the axiom closure
        of every node, a warning-free build, the paper anchors, clause and
        exponent counts, and quantifier order.  The Lean comparator
        (leanprover/comparator) checks the eight ParkingAudit pairs with the
        Lean kernel and again with the independent nanoda kernel; see
        ParkingAudit/COMPARATOR_RUNS.md for the results and reproduction steps.
        .github/workflows/comparator.yml runs it on request.
      cost:
        wall_time: "about eighteen days of calendar time"
        spend_usd: "not tracked (subscription and API accounts)"
        hardware: "a 20-thread Intel i9-9900X / 125 GB RAM Ubuntu machine"
      prompting_notes: >-
        Human-directed agent work, closely supervised by the author, with the
        author's statement-level decisions recorded.  Every statement was
        pinned before its proof was attempted, and proofs were accepted only
        through the manifest and axiom gates.
  spend_usd: "not tracked (subscription and API accounts)"
  notes: >-
    All Lean code in this repository was written by the listed models under the
    close supervision of the author.  Every proof is checked by the Lean kernel
    and Mathlib; the verified library contains no sorry and no custom axiom.
    The results the paper quotes without proof enter as explicit hypotheses,
    not axioms.  The Mathlib-only comparator challenge files
    (ParkingAudit/*/Challenge.lean) each contain exactly one intentional
    statement-level sorry (the theorem body), which is filled by the
    corresponding ParkingAudit/*/Solution.lean.  The dependencies
    Lattice-Probability and Divisible-Sandpile-Percolation are separate
    formalizations, not written for this repository.

fidelity:
  divergences: >-
    The formalization follows paper/parking.tex, which is arXiv:2609.02820v1
    with the corrections listed in paper/CHANGES_FROM_ARXIV.md.
    CORRESPONDENCE.md records how each Lean statement reads that file.  In
    summary:
    distances on Z^d are graph distances, as the paper fixes; the instruction
    stacks are indexed from zero; U_infinity is a supremum in the extended
    naturals and its mean a lower integral; lem:one-particle and
    lem:tagged-monotonicity are stated for a particle-driven construction whose
    law is proved equal to that of the stack construction; the second relation
    of eq:green-gradient is not stated; several measurability and
    exchangeability clauses are stated in the pathwise or joint form the proofs
    use; the scaling limit of prop:spatial-scaling is identified with an
    explicit Brownian optimal-stopping value, and locally uniform convergence
    is expressed by three convergence clauses; the limit of
    prop:oriented-scaling is asserted to exist rather than characterized; and
    the Brownian optimal-stopping values range over rules with integrable
    payoff.  The eleven cited results enter as hypotheses whose Lean
    statements are in ASSUMPTIONS.md; that they render the cited theorems
    faithfully is a reading, not a check.

review:
  status: "author-verified"
  reviewers:
    - "Ahmed Bou-Rabee"
  notes: >-
    Correctness of every proof is guaranteed by the Lean kernel and Mathlib (no
    sorry, no custom axiom).  The statement-level decisions were made by the
    author and recorded.  The statements were additionally audited by agents
    (GLM-5.3, Claude Opus 5, Claude Sonnet 5, and gpt-6-astra, whose audit was
    read-only).  This is not external peer review.

alignment:
  namespace: "Parking"
  statements:
