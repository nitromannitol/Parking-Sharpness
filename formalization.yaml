automation:
  methods:
    - method: "agent"
      models:
        - "claude-fable-5-1"
        - "claude-opus-5"
        - "claude-sonnet-5"
        - "claude-opus-5-5"
        - "gpt-6-astra"
        - "deepseek-v4.1-flash"
        - "glm-5.3"
        - "glm-5.3-flash"
        - "kimi-code/k3-256k"
      framework: >-
        Claude Code (Anthropic) as the supervising harness and, through its
        subagents, the main proving harness; Codex CLI (OpenAI) for
        gpt-6-astra (run_astra.sh); Kimi Code CLI for kimi-code/k3-256k;
        scripted API agent loops (glm_general.py) for the DeepSeek and GLM
        generals; scripted API fan-outs (glm_lean.py, glm_ask.py) for the
        compile-filtered proof candidates and statement audits
      tool_setup: >-
        Lake builds under leanprover/lean4:v4.32.0 with Mathlib at revision
        81a5d257c8e410db227a6665ed08f64fea08e997, Lattice-Probability at
        commit bbe0b90 and Divisible-Sandpile-Percolation at commit
        679a368e.  Division of labour: claude-fable-5-1 (Claude Code), the
        supervising session, set up the frozen-statement scaffold
        (2026-09-06), recorded the author's statement-level decisions, merged the agents'
        branches and synchronized the documents; claude-opus-5, as Claude Code
        subagents working in shifts (2026-09-06 to 2026-09-14), wrote most of
        the model, the statements and the proofs and sealed most of the
        paper's results; gpt-6-astra (Codex CLI) worked on the coupling behind
        the critical density lemma (2026-09-08, reasoning max), and four
        parallel runs and two follow-ups (reasoning xhigh, then high) proved
        the spatial scaling proposition and Theorem 1.5, consolidated the
        competing branches of that proof, and audited it for fidelity
        (2026-09-17 and 2026-09-18); deepseek-v4.1-flash generals (thinking
        low) wrote support modules for the oriented scaling proposition
        (2026-09-11 to 2026-09-14); a glm-5.3 general drafted moment and shift
        lemmas for the spatial scaling proposition (2026-09-14 and
        2026-09-15); kimi-code/k3-256k (Kimi Code CLI) checked and committed
        those lemmas and wrote the covariance algebra of the oriented
        potential (2026-09-15 and 2026-09-16); claude-sonnet-5, as Claude Code
        subagents (2026-09-16 to 2026-09-19), audited statements, wrote support
        lemmas for the two scaling propositions and prepared the release;
        glm-5.3-flash and deepseek-v4.1-flash drafted compile-filtered proof
        candidates for short goals, and glm-5.3 audited statements for the
        Opus agents; claude-opus-5-5 wrote Parking/MainTheorems.lean, the
        comparator surface Audit/, the assumptions generator's treatment of
        conditional proofs and this release documentation (2026-09-23 and
        2026-09-24).  A frozen-statement manifest (ledger/manifest.yaml) pins
        each registered statement by the SHA-256 of its text, and the tools/
        checkers verify the hashes, the axiom closure of every node, a
        warning-free build, the paper anchors, clause and exponent counts, and
        quantifier order.  The Lean comparator (leanprover/comparator) was run
        on the Audit pairs on 2026-09-24, at commit 9c18636, and every pair
        passed with the Lean kernel and again with the independent nanoda
        kernel; see Audit/COMPARATOR_RUNS.md for the results and reproduction
        steps.  .github/workflows/comparator.yml runs it on request.
      cost:
        wall_time: >-
          about eighteen days of calendar time (2026-09-06 to 2026-09-24): the
          statements frozen on 2026-09-06, every paper statement sealed by
          2026-09-18, the proved form of the sandpile growth input on
          2026-09-19, and the comparator surface on 2026-09-24
        spend_usd: "not tracked (subscription and API accounts)"
        hardware: "a 20-thread Intel i9-9900X / 125 GB RAM Ubuntu machine"
      prompting_notes: >-
        Human-directed agent work, supervised by the author, with the author's
        statement-level decisions recorded.  Every statement was
        pinned before its proof was attempted, and proofs were accepted only
        through the manifest and axiom gates.
  spend_usd: "not tracked (subscription and API accounts)"
  notes: >-
    All Lean code in this repository was written by the listed models under the
    supervision of the author.  Every proof is checked by the Lean kernel and
    Mathlib; the verified library contains no sorry and no custom axiom.  The
    results the paper quotes without proof enter as explicit hypotheses, not
    axioms.  The Mathlib-only comparator challenge files
    (Audit/*/Challenge.lean) each contain exactly one intentional
    statement-level sorry (the theorem body), which is filled by the
    corresponding Audit/*/Solution.lean.  The dependencies Lattice-Probability
    and Divisible-Sandpile-Percolation are separate formalizations, not written
    for this repository.

fidelity:
  divergences: >-
    The formalization follows paper/parking.tex, which is arXiv:2609.02820v1
    with the corrections listed in paper/CHANGES_FROM_ARXIV.md.
    CORRESPONDENCE.md records how each Lean statement reads that file.  In
    summary:
    distances on Z^d are graph distances, as the paper fixes; the instruction
    stacks are indexed from zero; U_infinity is a supremum in the extended
    naturals and its mean a lower integral; lem:one-particle and
    lem:tagged-monotonicity are stated for a particle-driven construction whose
    law is proved equal to that of the stack construction; the second relation
    of eq:green-gradient is not stated; several measurability and
    exchangeability clauses are stated in the pathwise or joint form the proofs
    use; the scaling limit of prop:spatial-scaling is identified with an
    explicit Brownian optimal-stopping value, and locally uniform convergence
    is expressed by three convergence clauses; the limit of
    prop:oriented-scaling is asserted to exist rather than characterized; and
    the Brownian optimal-stopping values range over rules with integrable
    payoff.  The eighteen cited results enter as hypotheses whose Lean
    statements are in ASSUMPTIONS.md; that they render the cited theorems
    faithfully is a reading, not a check.

review:
  status: "author-verified"
  reviewers:
    - "Ahmed Bou-Rabee"
  notes: >-
    Correctness of every proof is guaranteed by the Lean kernel and Mathlib (no
    sorry, no custom axiom).  The author made the statement-level
    decisions recorded during development.  The statements were additionally
    audited by GLM-5.3 auditors, by the Claude Opus 5 and Claude Sonnet 5
    agents, and by a read-only gpt-6-astra fidelity audit during development.
    This is not external peer review.

alignment:
  namespace: "Parking"
  statements:
    - source: "Theorem 1.1 (thm:subcritical-tail)"
      lean: "Parking.subcritical_tail"
      module: "Parking.MainTheorems"
      status: "proved"
      note: "Certified statement Parking.Frozen.subcritical_tail (thm-subcritical-tail). Comparator challenge Audit/SubcriticalTail/."
    - source: "Theorem 1.2 (thm:master)"
      lean: "Parking.master"
      module: "Parking.MainTheorems"
      status: "proved"
      note: "Certified statement Parking.Frozen.master (thm-master). Comparator challenge Audit/Master/."
    - source: "Corollary 1.3 (cor:growth)"
      lean: "Parking.growth"
      module: "Parking.MainTheorems"
      status: "proved"
      note: "Certified statement Parking.Frozen.growth (cor-growth). Comparator challenge Audit/Growth/."
    - source: "Theorem 1.4 (thm:trichotomy)"
      lean: "Parking.trichotomy"
      module: "Parking.MainTheorems"
      status: "proved"
      note: "Certified statement Parking.Frozen.trichotomy (thm-trichotomy). External.Stopping is discharged by Parking.External.stopping. Comparator challenge Audit/Trichotomy/."
    - source: "Theorem 1.5 (thm:nearest)"
      lean: "Parking.nearest"
      module: "Parking.MainTheorems"
      status: "proved"
      note: "Certified statement Parking.Frozen.nearest (thm-nearest). Comparator challenge Audit/Nearest/."
    - source: "Theorem 1.6 (thm:nearest-counterexample)"
      lean: "Parking.nearest_counterexample"
      module: "Parking.MainTheorems"
      status: "proved"
      note: "Certified statement Parking.Frozen.nearest_counterexample (thm-nearest-counterexample). Comparator challenge Audit/NearestCounterexample/."
    - source: "Theorem 1.7 (thm:near)"
      lean: "Parking.near"
      module: "Parking.MainTheorems"
      status: "proved"
      note: "Certified statement Parking.Frozen.near (thm-near). External.Stopping is discharged by Parking.External.stopping. Comparator challenge Audit/Near/."
    - source: "Theorem 1.8 (thm:oriented-walk)"
      lean: "Parking.oriented_walk"
      module: "Parking.MainTheorems"
      status: "proved"
      note: "Certified statement Parking.Frozen.oriented_walk (thm-oriented-walk). Comparator challenge Audit/OrientedWalk/."
    - source: "The lemmas, propositions and remaining theorems of Sections 2 to 9"
      lean: "Parking.Frozen.*"
      module: "Parking.Frozen"
      status: "proved"
      note: "One node per statement; the table of CORRESPONDENCE.md gives each Lean name, paper location and state."
    - source: "Cited results (eighteen, listed in ASSUMPTIONS.md)"
      lean: "Parking.External.*"
      module: "Parking.External"
      status: "assumed"
      note: "Explicit hypotheses of the theorems that use them; listed in ASSUMPTIONS.md."

acknowledgements: >-
  The paper is joint work with Christoforos Panagiotis.  Built on Lean 4,
  Mathlib, Lake, the shared library Lattice-Probability, the formalization
  Divisible-Sandpile-Percolation of the divisible sandpile paper, and
  leanprover/comparator.
